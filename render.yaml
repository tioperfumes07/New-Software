previews:
  generation: automatic

services:
  - type: web
    name: ih35-tms-backend
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build:backend
    # Boot smokes stay in GitHub CI (.github/workflows/ci.yml). Putting them here boots a
    # second full Node API for 90s+ during every Render deploy. Docs/OUTBOX SHAs then die
    # pre_deploy (~86s) while production is already serving — that is the "API failed again"
    # false alarm. Measured 2026-08-21: dep-da44v9e SHA 63fdc2b04 (docs) pre_deploy_failed;
    # d4a13f4 (#13461) went live and healthz/shallow returned JSON 200 version d4a13f4.
    # Migrate only. db:verify:critical-runtime belongs in GitHub CI — running it here
    # delayed PORT bind (~6 min measured 2026-08-22) so rolling updates died update_failed
    # while prod stayed on the old SHA (0cec933).
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    # HTTP ready check (not TCP-only). Live dashboard must match. Do not kick prod per merge.
    healthCheckPath: /api/v1/healthz/readyz
    # Skip rebuild on OUTBOX/bus pings only. Do NOT ignore all of docs/** — that left
    # required.json + AUDIT-COVERAGE-LIVE stale and forced GitHub-first matrix (healthz 502).
    # Dashboard service IH35-TMS must match this filter.
    buildFilter:
      ignoredPaths:
        - docs/bus/**
        - .cursor/**
        - AGENTS.md
        - CLAUDE.md
    envVars:
      - key: ENABLE_QBO_CDC_POLL
        value: "false"
      - key: ENABLE_QBO_INBOUND_SYNC
        value: "false"
      # QBO write-back is PARKED by law (00-IH35-LAW: "No write-back to QuickBooks, ever. Reconcile
      # only."). These three push schedulers last ran 2026-08-21 and only make background_jobs.stale
      # report them LATE (a non-revoked TRANSP realm keeps qboRealmConnected=true, so the health rule
      # treats an enabled-by-default push job as "should be running"). Pinning them OFF matches the
      # already-parked CDC/inbound flags above and makes health reflect the parked policy (dormant,
      # not stale) — never a write-back to QBO.
      - key: QBO_VENDORS_PUSH_SCHEDULER_ENABLED
        value: "false"
      - key: QBO_CUSTOMERS_PUSH_SCHEDULER_ENABLED
        value: "false"
      - key: QBO_ACCOUNTS_PUSH_SCHEDULER_ENABLED
        value: "false"
      - key: NODE_VERSION
        value: 22
      # G4-DEPLOY (0243-g4 / ACCT-R-04): preDeploy ci:boot-aggregate-smoke must assert against a
      # fixed TRANSP-owned unit, not the newest live row (one bad unit must not gate every deploy).
      # Set both UUIDs in the Render dashboard for ih35-tms-backend (TRANSP operating_company_id +
      # a stable mdata.units.id owned/leased to that company). See docs/testing/boot-aggregate-smoke-env.md.
      - key: IH35_SMOKE_UNIT_ID
        sync: false
      - key: IH35_SMOKE_OPERATING_COMPANY_ID
        sync: false
      # Production must never fall back to whichever live unit was updated most recently.
      - key: IH35_SMOKE_REQUIRE_FIXED_UNIT
        value: "true"

  - type: static
    name: ih35-tms-frontend
    buildCommand: cd apps/frontend && npm install && npm run build
    staticPublishPath: apps/frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.ih35dispatch.com
    headers:
      # Hashed build assets — filenames change per build, so cache them forever (first match wins).
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      # The app shell (index.html) + every SPA fallback route — NO s-maxage, so Cloudflare can't hold a
      # stale HTML shell for 5 min after a deploy (that caused "fixed but looks stale" reports). Must
      # revalidate every load so a new deploy is visible immediately. The hashed /assets/* above keep
      # their long immutable cache (filenames change per build, so they're always safe).
      - path: /*
        name: Cache-Control
        value: "public, max-age=0, must-revalidate"

  - type: static
    name: ih35-tms-driver
    buildCommand: npm install && npm run build:driver-pwa
    staticPublishPath: apps/driver-pwa/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.ih35dispatch.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # SCENARIO CERTIFIER — spec §4. NOTE: the schedule that actually runs is the IN-PROCESS cron
  # (apps/backend/src/home/scenario-certify.cron.ts, every 5 min America/Chicago). This service is
  # declared for parity with the spec and for manual/one-off runs, but Render cron SERVICES in this
  # blueprint have historically not been provisioned — so nothing here may be treated as proof the
  # certifier is running. Proof is audit.scenario_status rows refreshing, nothing less.
  - type: cron
    name: scenario-certify
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: npm install && npm run build:backend
    startCommand: node scripts/scenario-certify.mjs
    envVars:
      - key: NODE_VERSION
        value: 22

  # SCOREBOARD FROM LIVE — spec §5, scheduled alongside the certifier per owner order 2026-08-05.
  # CAVEAT, stated rather than hidden: this job's output is a FILE IN THE REPO, and a Render container
  # is ephemeral and is not a git checkout with push rights. On this service it will recompute and log,
  # but the committed docs/module-completion/*.json cannot be updated from here. The freshness
  # guarantee therefore comes from `npm run scoreboard:check` failing in CI when the committed file
  # drifts from live — that check is what actually catches staleness.
  - type: cron
    name: scoreboard-from-live
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: npm install && npm run build:backend
    startCommand: node scripts/scoreboard-from-live.mjs
    envVars:
      - key: NODE_VERSION
        value: 22

  - type: cron
    name: loves-card-import
    runtime: node
    schedule: "0 6 * * *"
    buildCommand: npm install && npm run build:backend
    startCommand: node dist/sync/run-loves-card-import.js
    envVars:
      - key: NODE_VERSION
        value: 22

  # RECON-01 — QBO↔TMS reconciliation passes (read-only; NEVER auto-fixes). No-op per entity while
  # TMS_QBO_RECON_ENABLED is OFF (default). Schedules are UTC (Render does not observe DST) = Central
  # Standard Time: 06:00 CST = 12:00 UTC (AM bank-count); 19:00 CST = 01:00 UTC (PM categorization-diff).
  # DB creds are set on the cron service in the Render dashboard (same as loves-card-import).
  - type: cron
    name: recon-am-bank-count
    runtime: node
    schedule: "0 12 * * *"
    buildCommand: npm install && npm run build:backend
    startCommand: node dist/accounting/recon/run-recon.js am
    envVars:
      - key: NODE_VERSION
        value: 22

  - type: cron
    name: recon-pm-categorization-diff
    runtime: node
    schedule: "0 1 * * *"
    buildCommand: npm install && npm run build:backend
    startCommand: node dist/accounting/recon/run-recon.js pm
    envVars:
      - key: NODE_VERSION
        value: 22

  # G10-C1 — daily audit hash-chain verification (tamper-evidence). Runs verifyEventChain per active
  # operating company, records to ops.audit_chain_verifications (append-only legal evidence), and alarms
  # the owner on a chain break or a missed run. Read-only against events.event_log; posts no money, flips
  # no flag. Schedule is UTC (Render does not observe DST): 09:00 UTC = 03:00 CST (a quiet overnight
  # window). DB creds are set on the cron service in the Render dashboard (same as loves-card-import).
  - type: cron
    name: audit-chain-verify
    runtime: node
    schedule: "0 9 * * *"
    buildCommand: npm install && npm run build:backend
    startCommand: node dist/audit/run-audit-chain-verify.js
    envVars:
      - key: NODE_VERSION
        value: 22
